name: macOS iPhone Full Test

on:
  workflow_dispatch:

jobs:
  iphone-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check Mac and Xcode
        run: |
          echo "===== macOS ====="
          sw_vers
          echo "===== CPU ====="
          uname -m
          echo "===== Xcode ====="
          xcodebuild -version
          echo "===== Developer Path ====="
          xcode-select -p

      - name: Connect Mac to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Check Tailscale
        run: |
          echo "===== Tailscale status ====="
          tailscale status
          echo "===== Mac Tailscale IP ====="
          tailscale ip -4

      - name: Test iPhone over Tailscale
        run: |
          echo "===== Testing iPhone ====="
          tailscale ping --timeout=10s 100.100.55.103 || true

      - name: Install iPhone tools
        run: |
          echo "===== Installing pymobiledevice3 ====="
          brew install pipx
          pipx ensurepath
          pipx install pymobiledevice3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pymobiledevice3" --version || true

      - name: Check Apple CoreDevice
        run: |
          echo "===== Apple CoreDevice ====="
          xcrun devicectl list devices || true

      - name: Check iPhone with pymobiledevice3
        run: |
          echo "===== USBMux devices ====="
          pymobiledevice3 usbmux list || true

          echo "===== Remote iPhone discovery ====="
          pymobiledevice3 remote browse || true

      - name: Final diagnostics
        run: |
          echo "================================"
          echo "FINAL TAILSCALE STATUS"
          echo "================================"
          tailscale status || true

          echo "================================"
          echo "MAC TAILSCALE IP"
          echo "================================"
          tailscale ip -4 || true

          echo "================================"
          echo "IPHONE TAILSCALE CONNECTION"
          echo "================================"
          tailscale ping --timeout=10s 100.100.55.103 || true

          echo "================================"
          echo "XCODE / COREDEVICE DEVICES"
          echo "================================"
          xcrun devicectl list devices || true

          echo "================================"
          echo "PYMOBILEDEVICE3 REMOTE DEVICES"
          echo "================================"
          pymobiledevice3 remote browse || true

          echo "================================"
          echo "TEST FINISHED"
          echo "================================"
